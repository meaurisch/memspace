[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memspace"
version = "0.1.0"
description = "Domain-neutral markdown memory spaces for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]
license = {text = "MIT"}
authors = [{name = "Morris (@meaurisch)"}]
keywords = ["memory", "agents", "llm", "markdown", "knowledge-base", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/meaurisch/memspace"
Source = "https://github.com/meaurisch/memspace"
Issues = "https://github.com/meaurisch/memspace/issues"
Design = "https://github.com/meaurisch/memspace/blob/master/docs/design.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
memspace = "memspace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
